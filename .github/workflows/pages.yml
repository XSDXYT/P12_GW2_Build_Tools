name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select validation scope
        id: scope
        run: node scripts/pages-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
        env:
          VITE_RELEASE_COMMIT: ${{ github.sha }}
      - name: Install Chromium for BD-only validation
        if: steps.scope.outputs.bd_only == 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install browsers for full validation
        if: steps.scope.outputs.bd_only != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: BD-only validation
        if: steps.scope.outputs.bd_only == 'true'
        run: npm run test:bd
      - run: npm run test:e2e -- --workers=2
        if: steps.scope.outputs.bd_only != 'true'
      - run: npm run test:compat -- --workers=2
        if: steps.scope.outputs.bd_only != 'true'
      - run: node scripts/verify-build.mjs
      - run: npm run test:workflow
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
